name: Release
run-name: Release ${{ inputs.version }} · ${{ inputs.platform }} • ${{ inputs.dispatch_id || 'manual' }}
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Installer platform (one target per attempt)
        required: true
        type: choice
        default: macos
        options:
          - macos
          - windows
      version:
        description: Release version
        required: true
        default: "0.0.1"
        type: string
      release_notes:
        description: Release notes
        required: true
        default: Initial release
        type: string
      dispatch_id:
        description: MoControl correlation ID (leave empty for manual runs)
        required: false
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: release-${{ inputs.version }}-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ${{ inputs.platform == 'windows' && 'windows-2022' || 'macos-15' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RELEASE_PLATFORM: ${{ inputs.platform }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      RELEASE_DISPATCH_ID: ${{ inputs.dispatch_id }}
      MOCONTROL_RELEASE_URL: ${{ vars.MOCONTROL_RELEASE_URL }}
      MOCONTROL_ORGANIZATION_ID: ${{ vars.MOCONTROL_ORGANIZATION_ID }}
      MOCONTROL_APP_ID: ${{ vars.MOCONTROL_APP_ID }}
      MOCONTROL_RELEASE_TOKEN: ${{ secrets.MOCONTROL_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Register release attempt
        run: node .mocontrol/release.mjs register
      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix .mocontrol/sign-cli
          npm run build --prefix .mocontrol/sign-cli
      - name: Build, sign, notarize and verify macOS
        if: inputs.platform == 'macos'
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PWD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
          MACOS_APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
          MACOS_APPLE_PASSWORD: ${{ secrets.MAC_APPLE_PASSWORD }}
        run: |
          set -euo pipefail
          export MACOS_SIGNING_P12_PATH="$RUNNER_TEMP/mocontrol-signing.p12"
          trap 'rm -f "$MACOS_SIGNING_P12_PATH"' EXIT
          node .mocontrol/release.mjs prepare
          node .mocontrol/release.mjs signing
          node .mocontrol/sign-cli/dist/index.js sign --project . --platform macos --signing-provider env
      - name: Build, sign and verify Windows
        if: inputs.platform == 'windows'
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.WINDOWS_AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.WINDOWS_AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_SIGNING_PROFILE_NAME: ${{ secrets.WINDOWS_AZURE_SIGNING_PROFILE_NAME }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.WINDOWS_AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ secrets.WINDOWS_AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.WINDOWS_AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.WINDOWS_AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          node .mocontrol/release.mjs prepare
          node .mocontrol/release.mjs signing
          node .mocontrol/sign-cli/dist/index.js sign --project . --platform windows --signing-provider env
      - name: Upload and publish verified installer
        run: node .mocontrol/release.mjs publish
      - name: Record failure
        if: failure()
        run: node .mocontrol/release.mjs failed
      - name: Record cancellation
        if: cancelled()
        run: node .mocontrol/release.mjs cancelled
